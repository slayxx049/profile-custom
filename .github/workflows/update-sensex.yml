name: Update Sensex panel

on:
  schedule:
    # Every 5 minutes on weekdays during the approximate Indian market session (UTC).
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sensex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch indicative Sensex snapshot and render panel
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from xml.sax.saxutils import escape

          url = "https://query1.finance.yahoo.com/v8/finance/chart/%5EBSESN?range=1d&interval=1m"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          result = payload["chart"]["result"][0]
          meta = result["meta"]
          price = meta.get("regularMarketPrice")
          previous = meta.get("previousClose") or meta.get("chartPreviousClose")
          if price is None or previous is None:
              raise RuntimeError("Sensex quote is missing price or previous close")

          change = price - previous
          percent = (change / previous) * 100 if previous else 0
          fetched = datetime.now(timezone.utc)
          market_time_epoch = meta.get("regularMarketTime")
          market_time = (
              datetime.fromtimestamp(market_time_epoch, ZoneInfo("Asia/Kolkata")).strftime("%d %b %Y · %I:%M:%S %p IST")
              if market_time_epoch else "Not supplied by source"
          )
          market_state = str(meta.get("marketState", "UNKNOWN")).replace("_", " ").title()

          timestamps = result.get("timestamp") or []
          quote = (result.get("indicators", {}).get("quote") or [{}])[0]
          closes = quote.get("close") or []
          history = [
              {"time": datetime.fromtimestamp(ts, ZoneInfo("Asia/Kolkata")).strftime("%H:%M"), "close": float(close)}
              for ts, close in zip(timestamps, closes)
              if close is not None
          ]

          snapshot = {
              "symbol": "^BSESN",
              "price": float(price),
              "previous_close": float(previous),
              "change": float(change),
              "change_percent": float(percent),
              "market_state": market_state,
              "market_time": market_time,
              "fetched_at": fetched.astimezone(ZoneInfo("Asia/Kolkata")).strftime("%d %b %Y · %I:%M:%S %p IST"),
              "history": history,
              "source": "Yahoo Finance chart endpoint; may be delayed"
          }
          with open("assets/sensex.json", "w", encoding="utf-8") as file:
              json.dump(snapshot, file, ensure_ascii=False, separators=(",", ":"))
              file.write("\\n")

          positive = change >= 0
          accent = "#65f2b5" if positive else "#ff718f"
          sign = "+" if positive else ""
          price_text = f"{price:,.2f}"
          change_text = f"{sign}{change:,.2f} ({sign}{percent:.2f}%)"
          updated = fetched.astimezone(ZoneInfo("Asia/Kolkata")).strftime("%d %b %Y · %I:%M %p IST")

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Indicative BSE Sensex {price_text}, change {change_text}">
            <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10152d"/><stop offset="1" stop-color="#24132f"/></linearGradient></defs>
            <rect x="1" y="1" width="898" height="188" rx="18" fill="url(#bg)" stroke="#7df9ff" stroke-opacity=".55"/>
            <text x="32" y="43" fill="#7df9ff" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">MARKET WATCH / INDICATIVE</text>
            <text x="32" y="105" fill="#f5f2ff" font-family="Arial,sans-serif" font-size="43" font-weight="700">SENSEX</text>
            <text x="32" y="143" fill="#aaa6c8" font-family="Arial,sans-serif" font-size="13">S&amp;P BSE SENSEX · ^BSESN · INR</text>
            <text x="868" y="77" text-anchor="end" fill="#f5f2ff" font-family="Arial,sans-serif" font-size="37" font-weight="700">{escape(price_text)}</text>
            <text x="868" y="111" text-anchor="end" fill="{accent}" font-family="Arial,sans-serif" font-size="20" font-weight="700">{escape(change_text)}</text>
            <text x="868" y="145" text-anchor="end" fill="#aaa6c8" font-family="Arial,sans-serif" font-size="12">Fetched {escape(updated)} · {escape(market_state)}</text>
            <text x="32" y="174" fill="#777c9e" font-family="Arial,sans-serif" font-size="10">YAHOO FINANCE SNAPSHOT · MAY BE DELAYED · NOT FOR TRADING</text>
          </svg>'''
          with open("assets/sensex.svg", "w", encoding="utf-8") as file:
              file.write(svg + "\\n")
          PY

      - name: Commit updated snapshot and panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sensex.svg assets/sensex.json
          if git diff --cached --quiet; then
            echo "Sensex snapshot is already up to date."
            exit 0
          fi
          git commit -m "Update Sensex market snapshot"
          git pull --rebase origin main
          git push
