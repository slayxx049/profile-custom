<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Retro game typography treatments</title>
<desc id="d">Two neon title treatments: a bold arcade-inspired display style and a blocky pixel-inspired style.</desc>
<defs>
 <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff9bd5"/><stop offset="1" stop-color="#ff5b91"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#c7ff83"/><stop offset="1" stop-color="#55d6a3"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="20" fill="#100d25"/>
<path d="M0 148H1200" stroke="#7df9ff" stroke-opacity=".25"/>
<text x="56" y="55" fill="#bdb4df" font-family="Arial,sans-serif" font-size="17" letter-spacing="6">01 / ARCADE DISPLAY</text>
<text x="52" y="133" fill="url(#pink)" stroke="#45113d" stroke-width="4" paint-order="stroke" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="82" font-weight="900" letter-spacing="1" filter="url(#glow)">SLAYXX049</text>
<text x="56" y="192" fill="#bdb4df" font-family="Arial,sans-serif" font-size="17" letter-spacing="6">02 / PIXEL-BLOCK DISPLAY</text>
<text x="52" y="265" fill="url(#cyan)" stroke="#153b3a" stroke-width="3" paint-order="stroke" font-family="'Courier New', monospace" font-size="66" font-weight="900" letter-spacing="3">BUILD MODE</text>
</svg>