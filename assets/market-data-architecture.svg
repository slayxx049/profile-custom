<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Read-only market data pipeline architecture</title>
<desc id="desc">Separate Binance crypto and SENSEX provider adapters feed a shared ingress, raw capture, verification, normalization, Parquet storage and read-only inspection.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#17152b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18243a"/><stop offset="1" stop-color="#111a2b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78e8ef"/></marker>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .head{fill:#f1f4ff;font:700 17px Arial,sans-serif}
    .sub{fill:#9caac3;font:12px Arial,sans-serif}
    .tiny{fill:#8292ad;font:10px ui-monospace,monospace;letter-spacing:1px}
    .box{fill:url(#panel);stroke:#42516c;stroke-width:1.2}
    .flow{fill:none;stroke:#78e8ef;stroke-width:2;marker-end:url(#arrow)}
    .muted{fill:none;stroke:#63728b;stroke-width:1.4;stroke-dasharray:5 5}
  </style>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/>
<g opacity=".16" fill="#7b8ca8"><circle cx="40" cy="40" r="1"/><circle cx="80" cy="40" r="1"/><circle cx="120" cy="40" r="1"/><circle cx="160" cy="40" r="1"/><circle cx="200" cy="40" r="1"/><circle cx="240" cy="40" r="1"/><circle cx="280" cy="40" r="1"/><circle cx="320" cy="40" r="1"/><circle cx="360" cy="40" r="1"/><circle cx="400" cy="40" r="1"/><circle cx="440" cy="40" r="1"/><circle cx="480" cy="40" r="1"/><circle cx="520" cy="40" r="1"/><circle cx="560" cy="40" r="1"/><circle cx="600" cy="40" r="1"/><circle cx="640" cy="40" r="1"/><circle cx="680" cy="40" r="1"/><circle cx="720" cy="40" r="1"/><circle cx="760" cy="40" r="1"/><circle cx="800" cy="40" r="1"/><circle cx="840" cy="40" r="1"/><circle cx="880" cy="40" r="1"/><circle cx="920" cy="40" r="1"/><circle cx="960" cy="40" r="1"/><circle cx="1000" cy="40" r="1"/><circle cx="1040" cy="40" r="1"/><circle cx="1080" cy="40" r="1"/><circle cx="1120" cy="40" r="1"/><circle cx="1160" cy="40" r="1"/></g>
<text x="38" y="43" class="mono" fill="#78e8ef" font-size="12" letter-spacing="2">MARKET DATA SYSTEMS / READ-ONLY PIPELINE</text>
<text x="38" y="72" class="mono" fill="#f1f4ff" font-size="24" font-weight="700">Capture first. Validate. Normalize. Inspect.</text>
<text x="1160" y="43" text-anchor="end" class="tiny">ARCHITECTURE BLUEPRINT · NOT LIVE STATUS</text>

<rect x="38" y="116" width="250" height="112" rx="10" class="box"/>
<text x="58" y="145" class="tiny" fill="#78e8ef">PROVIDER A / CRYPTO</text>
<text x="58" y="174" class="head">Binance adapter</text>
<text x="58" y="197" class="sub">Public WebSocket</text>
<text x="58" y="214" class="sub">REST snapshot, if required</text>

<rect x="38" y="264" width="250" height="112" rx="10" class="box"/>
<text x="58" y="293" class="tiny" fill="#ff91b0">PROVIDER B / INDIA INDEX</text>
<text x="58" y="322" class="head">SENSEX adapter</text>
<text x="58" y="345" class="sub">Independent provider integration</text>
<text x="58" y="362" class="sub">Provider selection pending</text>

<rect x="356" y="180" width="230" height="132" rx="10" class="box"/>
<text x="376" y="210" class="tiny">PROVIDER-NEUTRAL</text>
<text x="376" y="241" class="head">Ingress</text>
<text x="376" y="266" class="sub">Receive timestamp</text>
<text x="376" y="285" class="sub">Sequence + gap records</text>

<rect x="654" y="180" width="220" height="132" rx="10" class="box"/>
<text x="674" y="210" class="tiny">DURABLE SOURCE OF TRUTH</text>
<text x="674" y="241" class="head">Raw capture</text>
<text x="674" y="266" class="sub">Append-only segments</text>
<text x="674" y="285" class="sub">Clean-close marker</text>

<rect x="942" y="116" width="220" height="112" rx="10" class="box"/>
<text x="962" y="145" class="tiny">OFFLINE QUALITY GATE</text>
<text x="962" y="174" class="head">Verifier</text>
<text x="962" y="197" class="sub">Sequence / gaps / integrity</text>
<text x="962" y="214" class="sub">Incomplete capture stays visible</text>

<rect x="942" y="264" width="220" height="112" rx="10" class="box"/>
<text x="962" y="293" class="tiny">REPRODUCIBLE OUTPUT</text>
<text x="962" y="322" class="head">Normalizer</text>
<text x="962" y="345" class="sub">Ordered typed events</text>
<text x="962" y="362" class="sub">Raw remains authoritative</text>

<path d="M288 172H322V223H356" class="flow"/>
<path d="M288 320H322V269H356" class="flow"/>
<path d="M586 246H654" class="flow"/>
<path d="M874 246H908V172H942" class="flow"/>
<path d="M1052 228V264" class="flow"/>

<rect x="654" y="408" width="220" height="94" rx="10" class="box"/>
<text x="674" y="438" class="tiny">COLUMNAR DATA TIER</text>
<text x="674" y="467" class="head">Parquet datasets</text>
<text x="674" y="488" class="sub">Rebuildable normalized output</text>
<path d="M1052 376V390H764V408" class="flow"/>

<rect x="942" y="408" width="220" height="94" rx="10" class="box"/>
<text x="962" y="438" class="tiny">READ-ONLY OBSERVABILITY</text>
<text x="962" y="467" class="head">Inspector</text>
<text x="962" y="488" class="sub">Status, provenance, diagnostics</text>
<path d="M874 455H942" class="flow"/>

<path d="M764 312V390" class="muted"/>
<text x="38" y="455" class="tiny">INVARIANTS</text>
<text x="38" y="482" class="sub">Separate providers</text>
<text x="38" y="502" class="sub">Raw data preserved</text>
<text x="38" y="522" class="sub">Gaps never hidden</text>
<text x="356" y="455" class="tiny">OUT OF SCOPE</text>
<text x="356" y="482" class="sub">No strategies · no trading signals</text>
<text x="356" y="502" class="sub">No order routing · no execution</text>
<text x="356" y="522" class="sub">No simulated trading layer</text>
<text x="1160" y="538" text-anchor="end" class="tiny">PROJECT BLUEPRINT / IMPLEMENTATION NOT YET COMPLETE</text>
</svg>